[package]
name = "jeiconverter"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
description = "Converts a JEIExporter dump into the recipes.json read by MCRPV"
license = "MIT"

[[bin]]
name = "jeiconverter"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
