name: build

# The converter is Rust now, so CI compiles it on both targets and runs its self-test, which
# converts a small fixture dump and checks the JSON that comes out.
on:
  push:
    branches: [main, linux]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build + self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JEIConverter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: ./target/release/jeiconverter --selftest

      - name: Convert a fixture dump end to end
        run: |
          set -euo pipefail
          dump=$(mktemp -d)
          mkdir -p "$dump/recipes"
          printf '{"minecraft:oak_planks":"Oak Planks","minecraft:oak_log":"Oak Log"}' > "$dump/nameMap.json"
          printf '[{"output":{"item":"minecraft:oak_planks"},"inputs":[{"item":"minecraft:oak_log","count":2}]}]' \
            > "$dump/recipes/crafting_shapeless.json"
          ./target/release/jeiconverter "$dump" "$dump/out.json"
          test -s "$dump/out.json"
          grep -q '"oak_planks"' "$dump/out.json"
          grep -q '"Item": "oak_log"' "$dump/out.json"
          grep -q '"Count": 2' "$dump/out.json"

      - uses: actions/upload-artifact@v4
        with:
          name: jeiconverter-linux-x86_64
          path: JEIConverter/target/release/jeiconverter
          if-no-files-found: error

  windows:
    name: Windows build + self-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: JEIConverter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: target/release/jeiconverter.exe --selftest

      - name: Check the exe
        shell: pwsh
        working-directory: JEIConverter
        run: |
          $exe = "target/release/jeiconverter.exe"
          if (-not (Test-Path $exe)) { throw "jeiconverter.exe was not produced" }
          Write-Host "size: $((Get-Item $exe).Length) bytes"
