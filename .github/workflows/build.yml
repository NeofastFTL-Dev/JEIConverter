name: build

# The converter is Rust now, so CI compiles it on both targets and runs its self-test, which
# converts a small fixture dump and checks the JSON that comes out.
on:
  push:
    branches: [main, linux, macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build + self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JEIConverter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: ./target/release/jeiconverter --selftest

      - name: Convert a fixture dump end to end
        run: |
          set -euo pipefail
          dump=$(mktemp -d)
          mkdir -p "$dump/recipes"
          printf '{"minecraft:oak_planks":"Oak Planks","minecraft:oak_log":"Oak Log"}' > "$dump/nameMap.json"
          printf '[{"output":{"item":"minecraft:oak_planks"},"inputs":[{"item":"minecraft:oak_log","count":2}]}]' \
            > "$dump/recipes/crafting_shapeless.json"
          ./target/release/jeiconverter "$dump" "$dump/out.json"
          test -s "$dump/out.json"
          grep -q '"oak_planks"' "$dump/out.json"
          grep -q '"Item": "oak_log"' "$dump/out.json"
          grep -q '"Count": 2' "$dump/out.json"

      - uses: actions/upload-artifact@v4
        with:
          name: jeiconverter-linux-x86_64
          path: JEIConverter/target/release/jeiconverter
          if-no-files-found: error

  windows:
    name: Windows build + self-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: JEIConverter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked
      - run: target/release/jeiconverter.exe --selftest

      - name: Check the exe
        shell: pwsh
        working-directory: JEIConverter
        run: |
          $exe = "target/release/jeiconverter.exe"
          if (-not (Test-Path $exe)) { throw "jeiconverter.exe was not produced" }
          Write-Host "size: $((Get-Item $exe).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: jeiconverter-windows
          path: JEIConverter/target/release/jeiconverter.exe
          if-no-files-found: error

  macos:
    name: macOS build + self-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: JEIConverter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: JEIConverter

      - run: cargo build --release --locked
      - run: ./target/release/jeiconverter --selftest

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/jeiconverter)
          echo "$ftype"
          case "$ftype" in
            *Mach-O*) ;;
            *) echo "not a Mach-O binary"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: jeiconverter-macos
          path: JEIConverter/target/release/jeiconverter
          if-no-files-found: error

  release:
    name: Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jeiconverter-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: jeiconverter-macos
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: jeiconverter-windows
          path: dist/windows

      - name: Name the binaries after the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -s dist/linux/jeiconverter
          test -s dist/macos/jeiconverter
          test -s dist/windows/jeiconverter.exe
          mkdir -p out
          cp dist/linux/jeiconverter "out/jeiconverter-${version}-linux-x86_64"
          cp dist/macos/jeiconverter "out/jeiconverter-${version}-macos"
          cp dist/windows/jeiconverter.exe "out/jeiconverter-${version}-windows-x86_64.exe"
          chmod 755 out/jeiconverter-*
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: JEIConverter ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Converts a JEIExporter dump into the `recipes.json` read by
            [MCRPV](https://github.com/NeofastFTL-Dev/MCRPV).

            Linux x86_64, Windows x86_64 and macOS binaries are attached; each one is built and
            self-tested by CI on its own platform for this tag.
